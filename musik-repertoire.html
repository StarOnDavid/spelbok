    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #253916 0%, #65d067 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #253916 0%, #65d067 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .language-switcher {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .language-switcher select {
            padding: 8px 15px;
            border: 2px solid white;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9em;
        }

        .language-switcher select option {
            background: #65d067;
            color: white;
        }

        .language-switcher label {
            font-weight: 600;
            color: white;
            margin: 0;
        }

        .content {
            padding: 30px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #f2f6f0;
            border-radius: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #65d067;
        }

        .stat-label {
            color: #6c757d;
            font-size: 0.9em;
        }

        .form-section {
            background: #f2f6f0;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        input, select, textarea {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #65d067;
            box-shadow: 0 0 0 3px rgba(101, 208, 103, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #65d067 0%, #c9ea63 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(101, 208, 103, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 5px 15px;
            font-size: 0.85em;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .btn-edit {
            background: #c9ea63;
            color: #253916;
            padding: 5px 15px;
            font-size: 0.85em;
            margin-right: 5px;
            font-weight: 600;
        }

        .btn-edit:hover {
            background: #b8d955;
        }

        .btn-export {
            background: #253916;
            color: white;
            padding: 10px 20px;
            font-size: 0.9em;
            margin-right: 10px;
        }

        .btn-export:hover {
            background: #1a2910;
        }

        .btn-import {
            background: #65d067;
            color: white;
            padding: 10px 20px;
            font-size: 0.9em;
        }

        .btn-import:hover {
            background: #52b854;
        }

        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .table-section {
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .table-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #253916 0%, #65d067 100%);
            color: white;
        }

        th {
            padding: 15px 10px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9em;
            white-space: nowrap;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.9em;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: #f2f6f0;
        }

        .actions {
            display: flex;
            gap: 5px;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .filter-section {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #65d067;
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-header h3 {
            margin: 0;
            color: #333;
        }

        .btn-reset-filter {
            background: #253916;
            color: white;
            padding: 6px 15px;
            font-size: 0.85em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reset-filter:hover {
            background: #65d067;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-size: 0.9em;
            margin-top: 30px;
        }

        .footer a {
            color: #65d067;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                flex-direction: column;
            }

            .table-header {
                flex-direction: column;
                align-items: stretch;
            }

            .table-actions {
                width: 100%;
            }

            .table-actions .btn {
                flex: 1;
            }

            .language-switcher {
                position: static;
                justify-content: center;
                margin-bottom: 15px;
            }

            header {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="language-switcher">
                <label>🌐</label>
                <select id="languageSelect" onchange="changeLanguage(this.value)">
                    <option value="sv">Svenska</option>
                    <option value="de">Deutsch</option>
                    <option value="en">English</option>
                </select>
            </div>
            <h1><span id="headerIcon">🎵</span> <span data-i18n="appTitle">Musik Repertoire</span></h1>
            <p class="subtitle" data-i18n="appSubtitle">Hantera ditt musikrepertoar</p>
        </header>

        <div class="content">
            <!-- Statistics -->
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalSongs">0</div>
                    <div class="stat-label" data-i18n="totalSongs">Totala låtar</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="traditionalCount">0</div>
                    <div class="stat-label" data-i18n="traditionalSongs">Traditionella</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="newCount">0</div>
                    <div class="stat-label" data-i18n="newSongs">Nya</div>
                </div>
            </div>

            <!-- Form Section -->
            <div class="form-section">
                <h2 style="margin-bottom: 20px; color: #333;">
                    <span id="formTitle">Lägg till ny låt</span>
                </h2>
                <form id="songForm">
                    <input type="hidden" id="editId" value="">
                    
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label data-i18n="titel">Titel</label>
                        <input type="text" id="titel" data-i18n-placeholder="titelPlaceholder" placeholder="T.ex. Bingsjöpolska, Polska efter Hjort Anders" style="font-weight: 600; font-size: 1.1em;">
                    </div>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label data-i18n="lattyp">Låttyp</label>
                            <input type="text" id="lattyp" data-i18n-placeholder="lattypPlaceholder" placeholder="T.ex. Polska, Vals, Slängpolska">
                        </div>

                        <div class="form-group">
                            <label data-i18n="efterAv">Efter/Av</label>
                            <input type="text" id="efter_av" data-i18n-placeholder="efterAvPlaceholder" placeholder="Kompositör eller källa">
                        </div>

                        <div class="form-group">
                            <label data-i18n="ort">Ort</label>
                            <input type="text" id="ort" data-i18n-placeholder="ortPlaceholder" placeholder="Stad eller by">
                        </div>

                        <div class="form-group">
                            <label data-i18n="landskap">Landskap</label>
                            <input type="text" id="landskap" data-i18n-placeholder="landskapPlaceholder" placeholder="T.ex. Dalarna, Skåne">
                        </div>

                        <div class="form-group">
                            <label data-i18n="land">Land</label>
                            <input type="text" id="land" data-i18n-placeholder="landPlaceholder" placeholder="T.ex. Sverige, Norge">
                        </div>

                        <div class="form-group">
                            <label data-i18n="tonart">Tonart</label>
                            <input type="text" id="tonart" data-i18n-placeholder="tonartPlaceholder" placeholder="T.ex. A-dur, d-moll">
                        </div>

                        <div class="form-group">
                            <label data-i18n="svarighetsgrad">Svårighetsgrad</label>
                            <select id="svarighetsgrad">
                                <option value="" data-i18n="chooseDifficulty">Välj svårighetsgrad</option>
                                <option value="Lätt" data-i18n="easy">Lätt</option>
                                <option value="Medel" data-i18n="medium">Medel</option>
                                <option value="Svår" data-i18n="hard">Svår</option>
                                <option value="Mycket svår" data-i18n="veryHard">Mycket svår</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label data-i18n="lardeAv">Av vem lärde jag mig låten?</label>
                            <input type="text" id="larde_av" data-i18n-placeholder="lardeAvPlaceholder" placeholder="Lärare eller källa">
                        </div>

                        <div class="form-group">
                            <label data-i18n="inspelning">Var hittar jag inspelning?</label>
                            <input type="text" id="inspelning" data-i18n-placeholder="inspelningPlaceholder" placeholder="URL eller plattform">
                        </div>

                        <div class="form-group">
                            <label data-i18n="noter">Not?</label>
                            <input type="text" id="noter" data-i18n-placeholder="noterPlaceholder" placeholder="Finns noter?">
                        </div>

                        <div class="form-group">
                            <label data-i18n="tradEllerNy">Trad eller ny</label>
                            <select id="trad_eller_ny">
                                <option value="" data-i18n="chooseType">Välj typ</option>
                                <option value="Traditionell" data-i18n="traditional">Traditionell</option>
                                <option value="Ny" data-i18n="new">Ny</option>
                                <option value="Modern tolkning" data-i18n="modernInterpretation">Modern tolkning</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label data-i18n="instrumentKommentar">Instrument kommentar</label>
                            <input type="text" id="instrument_kommentar" data-i18n-placeholder="instrumentPlaceholder" placeholder="T.ex. Fiol, Nyckelharpa">
                        </div>
                    </div>

                    <div class="form-group">
                        <label data-i18n="utmaningar">Utmaningar / Bra att jobba på med låten</label>
                        <textarea id="utmaningar" data-i18n-placeholder="utmaningarPlaceholder" placeholder="Tekniska utmaningar, specifika delar att öva på..."></textarea>
                    </div>

                    <div class="form-group">
                        <label data-i18n="andraKommentarer">Andra kommentarer</label>
                        <textarea id="andra_kommentarer" data-i18n-placeholder="andraKommentarerPlaceholder" placeholder="Övriga anteckningar och kommentarer..."></textarea>
                    </div>

                    <div class="form-buttons">
                        <button type="button" class="btn btn-secondary" id="cancelBtn" data-i18n="cancel" style="display: none;">Avbryt</button>
                        <button type="submit" class="btn btn-primary" id="submitBtn">Lägg till låt</button>
                    </div>
                </form>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-header">
                    <h3><span data-i18n="filterTitle">🔍 Filtrera</span></h3>
                    <button class="btn-reset-filter" onclick="resetFilters()" data-i18n="resetFilters">Återställ filter</button>
                </div>
                <div class="filter-grid">
                    <div class="form-group">
                        <label data-i18n="search">Sök</label>
                        <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Sök i alla fält...">
                    </div>
                    <div class="form-group">
                        <label data-i18n="landskap">Landskap</label>
                        <select id="filterLandskap">
                            <option value="" data-i18n="allLandskap">Alla landskap</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="svarighetsgrad">Svårighetsgrad</label>
                        <select id="filterSvarighetsgrad">
                            <option value="" data-i18n="allDifficulties">Alla svårighetsgrader</option>
                            <option value="Lätt" data-i18n="easy">Lätt</option>
                            <option value="Medel" data-i18n="medium">Medel</option>
                            <option value="Svår" data-i18n="hard">Svår</option>
                            <option value="Mycket svår" data-i18n="veryHard">Mycket svår</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="tradEllerNy">Typ</label>
                        <select id="filterTradNy">
                            <option value="" data-i18n="allTypes">Alla typer</option>
                            <option value="Traditionell" data-i18n="traditional">Traditionell</option>
                            <option value="Ny" data-i18n="new">Ny</option>
                            <option value="Modern tolkning" data-i18n="modernInterpretation">Modern tolkning</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Table Section -->
            <div class="table-section">
                <div class="table-header">
                    <h2 style="color: #333;" data-i18n="repertoire">Repertoar</h2>
                    <div class="table-actions">
                        <button class="btn btn-export" onclick="exportData()"><span data-i18n="exportJson">📥 Exportera JSON</span></button>
                        <button class="btn btn-import" onclick="document.getElementById('importFile').click()"><span data-i18n="importJson">📤 Importera JSON</span></button>
                        <input type="file" id="importFile" accept=".json" onchange="importData(event)">
                    </div>
                </div>
                <div id="tableContainer"></div>
            </div>

            <!-- Footer -->
            <div class="footer">
                © 2025 David Staron
            </div>
        </div>
    </div>

    <script>
        // Translations
        const translations = {
            sv: {
                appTitle: "Musik Repertoire",
                appSubtitle: "Hantera ditt musikrepertoar",
                totalSongs: "Totala låtar",
                traditionalSongs: "Traditionella",
                newSongs: "Nya",
                addNewSong: "Lägg till ny låt",
                editSong: "Redigera låt",

                lattypPlaceholder: "T.ex. Polska, Vals, Slängpolska",
                efterAv: "Efter/Av",
                efterAvPlaceholder: "Kompositör eller källa",
                ort: "Ort",
                ortPlaceholder: "Stad eller by",
                landskap: "Landskap",
                landskapPlaceholder: "T.ex. Dalarna, Skåne",
                land: "Land",
                landPlaceholder: "T.ex. Sverige, Norge",
                tonart: "Tonart",
                tonartPlaceholder: "T.ex. A-dur, d-moll",
                svarighetsgrad: "Svårighetsgrad",
                chooseDifficulty: "Välj svårighetsgrad",
                easy: "Lätt",
                medium: "Medel",
                hard: "Svår",
                veryHard: "Mycket svår",
                utmaningar: "Utmaningar / Bra att jobba på med låten",
                utmaningarPlaceholder: "Tekniska utmaningar, specifika delar att öva på...",
                lardeAv: "Av vem lärde jag mig låten?",
                lardeAvPlaceholder: "Lärare eller källa",
                inspelning: "Var hittar jag inspelning?",
                inspelningPlaceholder: "URL eller plattform",
                noter: "Not?",
                noterPlaceholder: "Finns noter?",
                instrumentKommentar: "Instrument kommentar",
                instrumentPlaceholder: "T.ex. Fiol, Nyckelharpa",
                tradEllerNy: "Trad eller ny",
                chooseType: "Välj typ",
                traditional: "Traditionell",

        // Current language
        let currentLanguage = 'sv';

        // LocalStorage key
        const STORAGE_KEY = 'musikRepertoireSongs';
        const LANGUAGE_KEY = 'musikRepertoireLanguage';
        let songs = [];
        let editingId = null;
        let filteredSongs = [];

        // Generate unique ID
        function generateUniqueId() {
            return 'song_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // Load songs on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadLanguage();
            loadSongs();
            setupEventListeners();
        });

        function loadLanguage() {
            const saved = localStorage.getItem(LANGUAGE_KEY);
            if (saved && translations[saved]) {
                currentLanguage = saved;
                document.getElementById('languageSelect').value = saved;
            }
            updateLanguage();
        }

        function changeLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem(LANGUAGE_KEY, lang);
            updateLanguage();
            updateFilters(); // Update filter dropdowns with new language
        }

        function t(key) {
            return translations[currentLanguage][key] || key;
        }

        function updateLanguage() {
            // Update all elements with data-i18n attribute
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (element.tagName === 'OPTION') {
                    element.textContent = t(key);
                } else {
                    element.textContent = t(key);
                }
            });

            // Update placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
                const key = element.getAttribute('data-i18n-placeholder');
                element.placeholder = t(key);
            });

            // Update form title based on editing state
            updateFormTitle();
            
            // Re-render table to update headers
            if (songs.length > 0) {
                renderTable();
            }
        }

        function updateFormTitle() {
            const titleKey = editingId !== null ? 'editSong' : 'addNewSong';
            document.getElementById('formTitle').textContent = t(titleKey);
            document.getElementById('submitBtn').textContent = editingId !== null ? t('updateSong') : t('addSong');
        }

        function setupEventListeners() {
            // Form submission
            document.getElementById('songForm').addEventListener('submit', handleFormSubmit);
            
            // Cancel edit button
            document.getElementById('cancelBtn').addEventListener('click', resetForm);
            
            // Filter listeners
            document.getElementById('searchInput').addEventListener('input', filterSongs);
            document.getElementById('filterLandskap').addEventListener('change', filterSongs);
            document.getElementById('filterSvarighetsgrad').addEventListener('change', filterSongs);
            document.getElementById('filterTradNy').addEventListener('change', filterSongs);
        }

        function loadSongs() {
            const stored = localStorage.getItem(STORAGE_KEY);
            songs = stored ? JSON.parse(stored) : [];
            
            // Data migration: Convert old numeric IDs to new unique IDs
            let needsMigration = false;
            songs.forEach(song => {
                if (!song.id || typeof song.id === 'number') {
                    song.id = generateUniqueId();
                    needsMigration = true;
                }
            });
            
            // Save if migration occurred
            if (needsMigration && songs.length > 0) {
                saveSongs();
            }
            
            filteredSongs = [...songs];
            updateStats();
            updateFilters();
            renderTable();
        }

        function saveSongs() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(songs));
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            
            const formData = {
                titel: document.getElementById('titel').value,
                lattyp: document.getElementById('lattyp').value,
                efter_av: document.getElementById('efter_av').value,
                ort: document.getElementById('ort').value,
                landskap: document.getElementById('landskap').value,
                land: document.getElementById('land').value,
                tonart: document.getElementById('tonart').value,
                svarighetsgrad: document.getElementById('svarighetsgrad').value,
                utmaningar: document.getElementById('utmaningar').value,
                larde_av: document.getElementById('larde_av').value,
                inspelning: document.getElementById('inspelning').value,
                noter: document.getElementById('noter').value,
                instrument_kommentar: document.getElementById('instrument_kommentar').value,
                trad_eller_ny: document.getElementById('trad_eller_ny').value,
                andra_kommentarer: document.getElementById('andra_kommentarer').value
            };

            if (editingId !== null) {
                updateSong(editingId, formData);
            } else {
                addSong(formData);
            }

            resetForm();
            loadSongs();
        }

        function addSong(data) {
            const newSong = {
                id: generateUniqueId(),
                ...data
            };
            songs.unshift(newSong);
            saveSongs();
        }

        function updateSong(id, data) {
            const index = songs.findIndex(s => s.id === id);
            if (index !== -1) {
                songs[index] = { id, ...data };
                saveSongs();
            }
        }

        function deleteSong(songId) {
            if (!confirm(t('confirmDelete'))) return;
            
            // Find the song to confirm it exists
            const songToDelete = songs.find(s => s.id === songId);
            if (!songToDelete) {
                console.error('Song not found:', songId);
                return;
            }
            
            // Filter out only this specific song
            const beforeCount = songs.length;
            songs = songs.filter(s => s.id !== songId);
            const afterCount = songs.length;
            
            // Verify exactly one song was deleted
            if (beforeCount - afterCount !== 1) {
                console.error('Delete error: expected to delete 1 song, but deleted', beforeCount - afterCount);
            }
            
            saveSongs();
            loadSongs();
        }

        function editSong(songId) {
            const song = songs.find(s => s.id === songId);
            if (!song) return;
            
            editingId = song.id;
            document.getElementById('cancelBtn').style.display = 'block';

            document.getElementById('titel').value = song.titel || '';
            document.getElementById('lattyp').value = song.lattyp || '';
            document.getElementById('efter_av').value = song.efter_av || '';
            document.getElementById('ort').value = song.ort || '';
            document.getElementById('landskap').value = song.landskap || '';
            document.getElementById('land').value = song.land || '';
            document.getElementById('tonart').value = song.tonart || '';
            document.getElementById('svarighetsgrad').value = song.svarighetsgrad || '';
            document.getElementById('utmaningar').value = song.utmaningar || '';
            document.getElementById('larde_av').value = song.larde_av || '';
            document.getElementById('inspelning').value = song.inspelning || '';
            document.getElementById('noter').value = song.noter || '';
            document.getElementById('instrument_kommentar').value = song.instrument_kommentar || '';
            document.getElementById('trad_eller_ny').value = song.trad_eller_ny || '';
            document.getElementById('andra_kommentarer').value = song.andra_kommentarer || '';

            updateFormTitle();
            document.getElementById('songForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetForm() {
            editingId = null;
            document.getElementById('songForm').reset();
            document.getElementById('cancelBtn').style.display = 'none';
            updateFormTitle();
        }

        function updateStats() {
            document.getElementById('totalSongs').textContent = songs.length;
            
            const traditional = songs.filter(s => s.trad_eller_ny === 'Traditionell').length;
            const newSongs = songs.filter(s => s.trad_eller_ny === 'Ny').length;
            
            document.getElementById('traditionalCount').textContent = traditional;
            document.getElementById('newCount').textContent = newSongs;
        }

        function updateFilters() {
            // Update landskap filter
            const landskapSet = new Set();
            songs.forEach(s => {
                if (s.landskap) landskapSet.add(s.landskap);
            });
            
            const landskapSelect = document.getElementById('filterLandskap');
            const currentLandskap = landskapSelect.value;
            landskapSelect.innerHTML = `<option value="" data-i18n="allLandskap">${t('allLandskap')}</option>`;
            
            Array.from(landskapSet).sort().forEach(landskap => {
                const option = document.createElement('option');
                option.value = landskap;
                option.textContent = landskap;
                landskapSelect.appendChild(option);
            });
            
            landskapSelect.value = currentLandskap;
        }

        function filterSongs() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const landskapFilter = document.getElementById('filterLandskap').value;
            const svarighetsgradFilter = document.getElementById('filterSvarighetsgrad').value;
            const tradNyFilter = document.getElementById('filterTradNy').value;

            filteredSongs = songs.filter(song => {
                // Search filter
                if (searchTerm) {
                    const searchableText = Object.values(song).join(' ').toLowerCase();
                    if (!searchableText.includes(searchTerm)) return false;
                }

                // Landskap filter
                if (landskapFilter && song.landskap !== landskapFilter) return false;

                // Svårighetsgrad filter
                if (svarighetsgradFilter && song.svarighetsgrad !== svarighetsgradFilter) return false;

                // Trad/Ny filter
                if (tradNyFilter && song.trad_eller_ny !== tradNyFilter) return false;

                return true;
            });

            renderTable();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterLandskap').value = '';
            document.getElementById('filterSvarighetsgrad').value = '';
            document.getElementById('filterTradNy').value = '';
            filteredSongs = [...songs];
            renderTable();
        }

        function renderTable() {
            const container = document.getElementById('tableContainer');
            
            if (filteredSongs.length === 0) {
                const emptyTitle = songs.length === 0 ? t('noSongsYet') : t('noMatchingFilters');
                const emptyMsg = songs.length === 0 ? t('addFirstSong') : t('tryChangingFilters');
                
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                        </svg>
                        <h3>${emptyTitle}</h3>
                        <p>${emptyMsg}</p>
                    </div>
                `;
                return;
            }

            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>${t('titel')}</th>
                            <th>${t('lattyp')}</th>
                            <th>${t('efterAv')}</th>

                            <th>${t('land')}</th>
                            <th>${t('tonart')}</th>
                            <th>${t('svarighetsgrad')}</th>
                            <th>${t('utmaningar')}</th>

                            <th>${t('actions')}</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filteredSongs.forEach(song => {
                tableHTML += `
                    <tr>
                        <td style="font-weight: 600;">${escapeHtml(song.titel || '-')}</td>
                        <td>${escapeHtml(song.lattyp || '-')}</td>
                        <td>${escapeHtml(song.efter_av || '-')}</td>
                        <td>${escapeHtml(song.ort || '-')}</td>

                        <td>${escapeHtml(song.land || '-')}</td>
                        <td>${escapeHtml(song.tonart || '-')}</td>
                        <td>${escapeHtml(song.svarighetsgrad || '-')}</td>
                        <td>${escapeHtml(song.utmaningar || '-')}</td>

            container.innerHTML = tableHTML;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function exportData() {
            const dataStr = JSON.stringify(songs, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `musik-repertoire-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function isDuplicate(newSong) {
            return songs.some(existingSong => {
                // Compare all fields except 'id'
                return (existingSong.titel || '') === (newSong.titel || '') &&
                       (existingSong.lattyp || '') === (newSong.lattyp || '') &&
                       (existingSong.efter_av || '') === (newSong.efter_av || '') &&
                       (existingSong.ort || '') === (newSong.ort || '') &&
                       (existingSong.landskap || '') === (newSong.landskap || '') &&
                       (existingSong.land || '') === (newSong.land || '') &&
                       (existingSong.tonart || '') === (newSong.tonart || '') &&
                       (existingSong.svarighetsgrad || '') === (newSong.svarighetsgrad || '') &&
                       (existingSong.utmaningar || '') === (newSong.utmaningar || '') &&
                       (existingSong.larde_av || '') === (newSong.larde_av || '') &&
                       (existingSong.inspelning || '') === (newSong.inspelning || '') &&
                       (existingSong.noter || '') === (newSong.noter || '') &&
                       (existingSong.instrument_kommentar || '') === (newSong.instrument_kommentar || '') &&
                       (existingSong.trad_eller_ny || '') === (newSong.trad_eller_ny || '') &&
                       (existingSong.andra_kommentarer || '') === (newSong.andra_kommentarer || '');
            });
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        // Remove old IDs from imported data and check for duplicates
                        const cleanedData = importedData.map(song => {
                            const { id, ...songWithoutId } = song;
                            return songWithoutId;
                        });
                        
                        // Filter out duplicates
                        const newSongs = cleanedData.filter(song => !isDuplicate(song));
                        const duplicateCount = importedData.length - newSongs.length;
                        
                        if (newSongs.length === 0) {
                            alert(t('allDuplicates').replace('{count}', importedData.length));
                            event.target.value = '';
                            return;
                        }
                        
                        let confirmMsg = t('confirmImport').replace('{count}', newSongs.length);
                        if (duplicateCount > 0) {
                            confirmMsg += ' ' + t('duplicatesSkipped').replace('{count}', duplicateCount);
                        }
                        
                        if (confirm(confirmMsg)) {
                            newSongs.forEach(song => {
                                // addSong will generate a new unique ID
                                addSong(song);
                            });
                            loadSongs();
                            
                            let successMsg = t('importSuccess');
                            if (duplicateCount > 0) {
                                successMsg += ' ' + t('duplicatesSkipped').replace('{count}', duplicateCount);
                            }
                            alert(successMsg);
                        }
                    } else {
                        alert(t('invalidFileFormat'));
                    }
                } catch (error) {
                    alert(t('importError').replace('{error}', error.message));
                }
            };
            reader.readAsText(file);
            
            // Reset file input
            event.target.value = '';
        }

                    .then(registration => {

                    })
                    .catch(error => {
