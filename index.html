<!doctype html>
<html lang="sv">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>🎵 SpelBok</title>
        <meta
            name="description"
            content="Din digitala spelbok - Hantera ditt musikrepertoar"
        />
        <meta name="theme-color" content="#65d067" />
        <link rel="manifest" href="manifest.json" />

        <!-- Apple Touch Icons - Multiple sizes for iOS -->
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="assets/icons/apple-touch-icon.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="192x192"
            href="assets/icons/web-app-manifest-192x192.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="512x512"
            href="assets/icons/web-app-manifest-512x512.png"
        />

        <!-- Standard Icons -->
        <link
            rel="icon"
            type="image/png"
            sizes="96x96"
            href="assets/icons/favicon-96x96.png"
        />
        <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
        <link rel="shortcut icon" href="assets/icons/favicon.ico" />

        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="SpelBok" />
        <link rel="stylesheet" href="assets/css/styles.css" />
    </head>
    <body>
        <div class="container">
            <header>
                <div class="language-switcher">
                    <label>🌐</label>
                    <select
                        id="languageSelect"
                        onchange="changeLanguage(this.value)"
                    >
                        <option value="sv">Svenska</option>
                        <option value="de">Deutsch</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <h1>
                    <span id="headerIcon">🎵</span>
                    <span data-i18n="appTitle">SpelBok</span>
                </h1>
                <p class="subtitle" data-i18n="appSubtitle">
                    Din digitala spelbok
                </p>
            </header>
            <div class="content">
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-number" id="totalSongs">0</div>
                        <div class="stat-label" data-i18n="totalSongs">
                            Totala låtar
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="traditionalCount">0</div>
                        <div class="stat-label" data-i18n="traditionalSongs">
                            Traditionella
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="newCount">0</div>
                        <div class="stat-label" data-i18n="newSongs">Nya</div>
                    </div>
                </div>
                <div class="form-section">
                    <h2 style="margin-bottom: 20px; color: #333">
                        <span id="formTitle">Lägg till ny låt</span>
                    </h2>
                    <form id="songForm">
                        <input type="hidden" id="editId" value="" />
                        <div class="form-group" style="margin-bottom: 20px">
                            <label data-i18n="titel">Titel</label>
                            <input
                                type="text"
                                id="title"
                                data-i18n-placeholder="titelPlaceholder"
                                placeholder="T.ex. Bingsjöpolska"
                                style="font-weight: 600; font-size: 1.1em"
                            />
                        </div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label data-i18n="lattyp">Låttyp</label
                                ><input
                                    type="text"
                                    id="songType"
                                    data-i18n-placeholder="lattypPlaceholder"
                                    placeholder="T.ex. Polska"
                                />
                            </div>
                            <div class="form-group">
                                <label data-i18n="efterAv">Efter/Av</label
                                ><input
                                    type="text"
                                    id="composer"
                                    data-i18n-placeholder="efterAvPlaceholder"
                                    placeholder="Kompositör"
                                />
                            </div>
                            <div class="form-group">
                                <label data-i18n="ort">Ort</label
                                ><input
                                    type="text"
                                    id="location"
                                    data-i18n-placeholder="ortPlaceholder"
                                    placeholder="Stad"
                                />
                            </div>
                            <div class="form-group">
                                <label data-i18n="landskap">Landskap</label
                                ><input
                                    type="text"
                                    id="region"
                                    data-i18n-placeholder="landskapPlaceholder"
                                    placeholder="T.ex. Dalarna"
                                />
                            </div>
                            <div class="form-group">
                                <label data-i18n="land">Land</label
                                ><input
                                    type="text"
                                    id="country"
                                    data-i18n-placeholder="landPlaceholder"
                                    placeholder="T.ex. Sverige"
                                />
                            </div>
                            <div class="form-group">
                                <label data-i18n="tonart">Tonart</label
                                ><input
                                    type="text"
                                    id="key"
                                    data-i18n-placeholder="tonartPlaceholder"
                                    placeholder="T.ex. A-dur"
                                />
                            </div>
                            <div class="form-group">
                                <label data-i18n="svarighetsgrad"
                                    >Svårighetsgrad</label
                                ><select id="difficulty">
                                    <option value="" data-i18n-option="choose">
                                        Välj
                                    </option>
                                    <option
                                        value="easy"
                                        data-i18n-option="easy"
                                    >
                                        Lätt
                                    </option>
                                    <option
                                        value="medium"
                                        data-i18n-option="medium"
                                    >
                                        Medel
                                    </option>
                                    <option
                                        value="hard"
                                        data-i18n-option="hard"
                                    >
                                        Svår
                                    </option>
                                    <option
                                        value="veryHard"
                                        data-i18n-option="veryHard"
                                    >
                                        Mycket svår
                                    </option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label data-i18n="lardeAv"
                                    >Av vem lärde jag mig låten?</label
                                ><input
                                    type="text"
                                    id="learnedFrom"
                                    data-i18n-placeholder="lardeAvPlaceholder"
                                />
                            </div>
                            <div class="form-group">
                                <label data-i18n="inspelning">Inspelning?</label
                                ><input
                                    type="text"
                                    id="recording"
                                    data-i18n-placeholder="inspelningPlaceholder"
                                />
                            </div>
                            <div class="form-group">
                                <label data-i18n="noter">Not?</label
                                ><input
                                    type="text"
                                    id="notes"
                                    data-i18n-placeholder="noterPlaceholder"
                                />
                            </div>
                            <div class="form-group">
                                <label data-i18n="tradEllerNy">Trad/ny</label
                                ><select id="type">
                                    <option value="" data-i18n-option="choose">
                                        Välj
                                    </option>
                                    <option
                                        value="traditional"
                                        data-i18n-option="traditional"
                                    >
                                        Traditionell
                                    </option>
                                    <option value="new" data-i18n-option="new">
                                        Ny
                                    </option>
                                    <option
                                        value="modernInterpretation"
                                        data-i18n-option="modernInterpretation"
                                    >
                                        Modern tolkning
                                    </option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label data-i18n="instrumentKommentar"
                                    >Instrument</label
                                ><input
                                    type="text"
                                    id="instrumentComment"
                                    data-i18n-placeholder="instrumentPlaceholder"
                                />
                            </div>
                        </div>
                        <div class="form-group">
                            <label data-i18n="utmaningar">Utmaningar</label
                            ><textarea
                                id="challenges"
                                data-i18n-placeholder="utmaningarPlaceholder"
                            ></textarea>
                        </div>
                        <div class="form-group">
                            <label data-i18n="andraKommentarer"
                                >Kommentarer</label
                            ><textarea
                                id="otherComments"
                                data-i18n-placeholder="andraKommentarerPlaceholder"
                            ></textarea>
                        </div>
                        <div class="form-buttons">
                            <button
                                type="button"
                                class="btn btn-secondary"
                                id="cancelBtn"
                                data-i18n="cancel"
                                style="display: none"
                            >
                                Avbryt
                            </button>
                            <button
                                type="submit"
                                class="btn btn-primary"
                                id="submitBtn"
                            >
                                Lägg till låt
                            </button>
                        </div>
                    </form>
                </div>
                <div class="filter-section">
                    <div class="filter-header">
                        <h3>
                            <span data-i18n="filterTitle">🔍 Filtrera</span>
                        </h3>
                        <button
                            class="btn-reset-filter"
                            onclick="resetFilters()"
                            data-i18n="resetFilters"
                        >
                            Återställ
                        </button>
                    </div>
                    <div class="filter-grid">
                        <div class="form-group">
                            <label data-i18n="search">Sök</label
                            ><input
                                type="text"
                                id="searchInput"
                                placeholder="Sök..."
                            />
                        </div>
                        <div class="form-group">
                            <label data-i18n="landskap">Landskap</label
                            ><select id="filterRegion">
                                <option value="">Alla</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label data-i18n="svarighetsgrad"
                                >Svårighetsgrad</label
                            ><select id="filterDifficulty">
                                <option value="">Alla</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label data-i18n="tradEllerNy">Typ</label
                            ><select id="filterType">
                                <option value="">Alla</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="table-section">
                    <div class="table-header">
                        <h2 style="color: #333" data-i18n="repertoire">
                            Repertoar
                        </h2>
                        <div class="table-actions">
                            <button
                                class="btn btn-export"
                                onclick="exportData()"
                            >
                                <span data-i18n="exportJson"
                                    >📥 Exportera JSON</span
                                >
                            </button>
                            <button
                                class="btn btn-import"
                                onclick="document.getElementById('importFile').click()"
                            >
                                <span data-i18n="importJson"
                                    >📤 Importera JSON</span
                                >
                            </button>
                            <input
                                type="file"
                                id="importFile"
                                accept=".json"
                                onchange="importData(event)"
                            />
                        </div>
                    </div>
                    <div id="tableContainer"></div>
                </div>
                <div class="footer">© 2025 David Staron</div>
            </div>
        </div>
        <!-- Load libraries and modules in order -->
        <script src="assets/js/vendor/dexie.min.js"></script>
        <script src="assets/js/db.js"></script>
        <script src="assets/js/i18n.js"></script>
        <script src="assets/js/app.js"></script>
    </body>
</html>
